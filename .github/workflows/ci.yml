name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: ['6387:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: sudo apt-get update && sudo apt-get install -y libseccomp2
      - run: uv run pytest
        env:
          AIGHT_TEST_REDIS_URL: redis://localhost:6387/15
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code docs/openapi.json
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/AIGht.Web/package-lock.json
      - run: npm ci --omit=optional
        working-directory: src/AIGht.Web
      - run: npm run assets
        working-directory: src/AIGht.Web
      - run: git diff --exit-code src/AIGht.Web/wwwroot/vendor src/AIGht.Web/wwwroot/fonts
      - run: dotnet restore src/AIGht.Web/AIGht.Web.csproj --locked-mode
      - run: dotnet build src/AIGht.Web/AIGht.Web.csproj -c Release --no-restore
      - run: node --check src/AIGht.Web/wwwroot/js/document-space.js
